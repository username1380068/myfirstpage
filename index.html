<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>我的第一个网页</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f2f6fa;
        color: #24364b;
        font-family: "Microsoft YaHei", sans-serif;
      }
      main {
        width: min(100%, 620px);
        padding: 42px;
        border: 1px solid #e3eaf0;
        border-radius: 18px;
        background: white;
        box-shadow: 0 18px 50px #19395b12;
      }
      .label { color: #567ca2; font-size: 12px; font-weight: 700; letter-spacing: .16em; }
      h1 { margin: 16px 0 12px; font-size: clamp(30px, 7vw, 44px); }
      p { color: #68798b; line-height: 1.9; }
      .tip { margin-top: 28px; padding: 15px 18px; border-radius: 10px; background: #f1f7f4; color: #47705d; font-size: 14px; }
      footer { margin-top: 28px; color: #9aa8b5; font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <div class="label">MY FIRST WEB PAGE</div>
      <h1>你好，欢迎来到我的第一个网页。</h1>
      <p>这个页面由一个 HTML 文件组成。我把它上传到 GitHub，再通过 GitHub Pages 让别人用网址打开。</p>
      <div class="tip">练习：把这句话改成你喜欢的一句话，然后重新上传，看看网页会怎样变化。</div>
      <footer>这是练习页面，请不要在这里填写学生姓名、学号或作业内容。</footer>
    </main>
  </body>
</html>
