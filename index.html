<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>这里是浏览器标签页上的标题</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f2f6fa;
        color: #24364b;
        font-family: "Microsoft YaHei", sans-serif;
      }
      main {
        width: min(100%, 620px);
        padding: 42px;
        border: 1px solid #e3eaf0;
        border-radius: 18px;
        background: white;
        box-shadow: 0 18px 50px #19395b12;
      }
      .label { color: #567ca2; font-size: 12px; font-weight: 700; letter-spacing: .16em; }
      h1 { margin: 16px 0 12px; font-size: clamp(30px, 7vw, 44px); }
      p { color: #68798b; line-height: 1.9; }
      .tip { margin-top: 28px; padding: 15px 18px; border-radius: 10px; background: #f1f7f4; color: #47705d; font-size: 14px; }
      footer { margin-top: 28px; color: #9aa8b5; font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <div class="label">这里大概是小标题？</div>
      <h1>我不知道这个&lt;/h1&gt;是什么意思。可能是大标题？</h1>
      <p>这个页面居然是aigc??????</p>
      <div class="tip">test111</div>
      <footer>练习页面？</footer>
    </main>
  </body>
</html>
